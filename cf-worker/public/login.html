<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — GV Agent Core</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <form id="loginForm" class="login-card">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="1.8"><path d="M12 2a7 7 0 0 1 7 7c0 2.4-1.2 4.2-2.6 5.4-.9.8-1.4 2.1-1.4 3.6H9c0-1.5-.5-2.8-1.4-3.6C6.2 13.2 5 11.4 5 9a7 7 0 0 1 7-7z"/><path d="M9 21h6"/></svg>
    </div>
    <h1>GV Agent Core</h1>
    <p class="muted">Growth Ventures — Feature Funnel ka complete agent</p>
    <label>Username<input name="username" autocomplete="username" required value="admin"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p id="err" class="error"></p>
    <button type="submit" class="btn primary w100">Login</button>
  </form>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') }) });
  if (r.ok) { location.href = '/'; return; }
  const j = await r.json().catch(() => ({}));
  document.getElementById('err').textContent = j.error || 'Login fail ho gaya';
});
</script>
</body>
</html>
